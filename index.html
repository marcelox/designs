<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vite + TS</title>
</head>
<body>
<header class="header">
    <div class="logo">
        <span>Parkour</span>Stations
    </div>
    <div class="nav-buttons">
        <button>⌚</button>
        <button>⋮</button>
        <button>👤</button>
    </div>
</header>

<main class="main-content">
    <nav class="navigation">
        <a href="#" class="home-button">Home</a>
        <button class="preview-button">Preview</button>
    </nav>

    <p class="customization-text">Add a note for your guests, or include a shared photo album or playlist.</p>

    <div class="cards-container">
        <div class="main-card">
            <div class="image-buttons">
                <button class="image-button">📷</button>
                <button class="image-button">☁️</button>
            </div>
            <div class="event-details">
                <h2 class="event-name">Event Name</h2>
                <button class="detail-button">📅 Date and Time</button>
                <button class="detail-button">📍 Address</button>
            </div>
        </div>

        <div class="feature-card">
            <div class="host-info">
                <div class="host-avatar">M</div>
                <div>
                    <div>Team 1</div>
                    <div style="opacity: 0.7; font-size: 0.9rem;">Host Note</div>
                </div>
            </div>
            <div class="feature-content">
                <p style="opacity: 0.7;">Tell guests about your event...</p>
            </div>
        </div>

        <div class="feature-card">
            <div class="host-info">
                <div style="width: 30px; height: 30px;">📸</div>
                <div>
                    <div>Photos</div>
                    <div style="opacity: 0.7; font-size: 0.9rem;">Shared Album</div>
                </div>
            </div>
            <div class="feature-content">
                <div id="app"></div>
            </div>
        </div>

        <div class="feature-card">
            <div class="host-info">
                <div style="width: 30px; height: 30px;">🎵</div>
                <div>
                    <div>Music</div>
                    <div style="opacity: 0.7; font-size: 0.9rem;">Playlist</div>
                </div>
            </div>
            <div class="feature-content">
                <p style="opacity: 0.7;">Add a Playlist so guests can listen to and add songs.</p>
            </div>
            <button class="feature-button">Add Playlist</button>
        </div>
    </div>
</main>

<script src="/src/main.ts" type="module"></script>
</body>
</html>
