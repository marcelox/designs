<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div class="header">
      <h1>iCloud Invites</h1>
      <p>Customize Your Invitation</p>
      <div class="buttons">
        <button class="button">Home</button>
        <button class="button">Preview</button>
      </div>
    </div>
    <div class="background-blur"></div>
    <div class="overlay"></div>
    <div class="container">
      <div class="card">
        <div id="app"></div>
      </div>
      <div class="card">
        <h2>Station 1</h2>
        <p>Date and Time</p>
        <p>Address</p>
      </div>
      <div class="card">
        <h2>Station 2</h2>
        <p>Tell guests about your event...</p>
      </div>
      <div class="card">
        <h2>Station 3</h2>
        <p>Create a shared album</p>
      </div>
      <div class="card">
        <h2>Station 4</h2>
        <p>Add an Apple Music playlist</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
